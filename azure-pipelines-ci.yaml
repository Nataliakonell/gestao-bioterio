name: $(Rev:r)
trigger:
  branches:
    include:
      - master
  paths:
    exclude:
      - azure-pipelines-ci.yaml
      - azure-pipelines-cd.yaml

variables:
  - group: azure

stages:
  - stage: build_backend
    displayName: Build Backend
    jobs:
      - job: build_backend
        displayName: Build and push backend image
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Docker login (backend)
            inputs:
              containerRegistry: "admucdbcr.azurecr.io"
              command: "login"

          - script: |
              docker build --build-arg PAT=$SYSTEM_ACCESSTOKEN -f Backend/Gestao-Bioterio.Api/Dockerfile -t sigbio-api:$(Build.BuildNumber) Backend
              docker tag sigbio-api:$(Build.BuildNumber) $(registry_server)/sigbio-api:$(Build.BuildNumber)
              docker push $(registry_server)/sigbio-api:$(Build.BuildNumber)
            displayName: Build/Push backend
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - stage: build_frontend
    displayName: Build Frontend
    dependsOn: build_backend
    jobs:
      - job: build_frontend
        displayName: Build and push frontend image
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Docker login (frontend)
            inputs:
              containerRegistry: "admucdbcr.azurecr.io"
              command: "login"

          - script: |
              echo Building frontend image
              docker build \
                -f Frontend/Dockerfile -t sigbio-frontend:$(Build.BuildNumber) Frontend
              docker tag sigbio-frontend:$(Build.BuildNumber) $(registry_server)/sigbio-frontend:$(Build.BuildNumber)
              docker push $(registry_server)/sigbio-frontend:$(Build.BuildNumber)
            displayName: Build/Push frontend
