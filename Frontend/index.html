<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGBio UCDB</title>
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('sigbio:appearance') || 'null');
        if (a && a.mode === 'dark') document.documentElement.classList.add('dark');
        if (a && a.accent && a.accent !== 'blue') document.documentElement.setAttribute('data-accent', a.accent);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
